name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Install the supported Anki runtime
        run: python -m pip install "aqt[qt69]==26.9.3"
      - name: Run unit and isolated Anki tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the .ankiaddon package
        run: python scripts/build_addon.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: oneki-reviewer-addon
          path: dist/*.ankiaddon
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oneki-reviewer-addon
          path: dist
      - name: Publish latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.ankiaddon
          --verify-tag --generate-notes --latest
