name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-python36:
    runs-on: ubuntu-latest
    container: python:3.6.15-buster
    steps:
      - uses: actions/checkout@v4
      - name: Check the Python 3.6 legacy path
        run: python tests/legacy_py36_smoke.py

  legacy-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Install Anki 2.1.50 runtime
        run: python -m pip install "aqt[qt6]==2.1.50"
      - name: Test V2 and V3 scheduler compatibility
        run: python -m unittest tests.test_scheduler_compat -v
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Install Anki 26.9 runtime
        run: python -m pip install "aqt[qt69]==26.9"
      - name: Test with Anki 26.9
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Upgrade to Anki 26.9.4 runtime
        run: python -m pip install --upgrade "aqt[qt69]==26.9.4"
      - name: Test with Anki 26.9.4
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the .ankiaddon package
        run: python scripts/build_addon.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: oneki-reviewer-addon
          path: dist/*.ankiaddon
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oneki-reviewer-addon
          path: dist
      - name: Publish latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.ankiaddon
          --verify-tag --generate-notes --latest
